[package]
name = "syscall"
version = "0.1.0"
edition = "2024"

[features]
default = []
debug-sched = []  # Enable scheduler debug output in sleep/wake paths
debug-syscall = []  # Enable syscall entry/exit traces ([SC] open/write/dup2)
debug-syscall-perf = []  # Log syscalls taking >50K cycles (~16us @ 3GHz)
debug-exit = []  # Debug output for exit syscall
debug-proc = []  # Enable waitpid/process debug traces
debug-vma = ["mm-vma/debug-vma"]  # Enable VMA insert/remove traces

[dependencies]
os_core = { path = "../../core/os_core" }
proc = { path = "../../proc/proc" }
proc-traits = { path = "../../proc/proc-traits" }
mm-traits = { path = "../../mm/mm-traits" }
mm-manager = { path = "../../mm/mm-manager" }
mm-vma = { path = "../../mm/mm-vma" }
vfs = { path = "../../vfs/vfs" }
signal = { path = "../../signal/signal" }
net = { path = "../../net/net" }
unix-socket = { path = "../../net/unix" }
tcpip = { path = "../../net/tcpip" }
dhcp = { path = "../../net/dhcp" }
input = { path = "../../input/input" }
mmap = { path = "../../libc-support/mmap" }
crypto = { path = "../../security/crypto" }
os_log = { path = "../../core/os_log" }
sched = { path = "../../sched/sched" }
smp = { path = "../../smp/smp" }
mm-cow = { path = "../../mm/mm-cow" }
mm-paging = { path = "../../mm/mm-paging" }
mm-pagedb = { path = "../../mm/mm-pagedb" }
mm-vmstat = { path = "../../mm/mm-vmstat" }
mm-reclaim = { path = "../../mm/mm-reclaim" }
sched-traits = { path = "../../sched/sched-traits" }
waitqueue = { path = "../../core/waitqueue" }
module = { path = "../../module/module" }
driver-core = { path = "../../drivers/driver-core" }
shm = { path = "../../ipc/shm" }
spin = { workspace = true }
